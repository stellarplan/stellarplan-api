# Render deployment blueprint for StellarPlan API
# Render reads this automatically when you create a Blueprint instance.
services:
  - type: web
    name: stellarplan-api
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stellarplan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        sync: false # set to your frontend origin, e.g. https://stellarplan-web.onrender.com
      - key: STELLAR_HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: STELLAR_NETWORK_PASSPHRASE
        value: "Test SDF Network ; September 2015"
      - key: SOROBAN_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: STELLAR_SECRET_KEY
        sync: false # funded testnet/mainnet keypair that signs vault invocations (required for allocations/releases)
      - key: VAULT_CONTRACT_ID
        sync: false # fallback PlanVault contract id used when a user has no per-wallet contract
      - key: USDC_TOKEN_CONTRACT
        sync: false # Soroban token contract id for the asset held in vaults

databases:
  - name: stellarplan-db
    databaseName: stellarplan
    plan: starter
